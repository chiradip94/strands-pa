<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Assistant Chat</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Threads</h2>
                <button id="new-chat-btn" title="New chat">+</button>
            </div>
            <div id="session-list"></div>
        </aside>

        <div id="main-area">
            <header>
                <div class="status-container">
                    <div id="connection-status" class="status-dot"></div>
                    <span id="status-text">Connecting...</span>
                </div>
                <h1>Personal Assistant</h1>
            </header>

            <main id="chat-container">
                <div id="messages">
                </div>
                <div id="thinking-indicator" class="hidden">
                    <div class="dot-pulse"></div>
                    <span>Thinking...</span>
                </div>
            </main>

            <footer>
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="Ask anything..." autocomplete="off">
                    <button type="submit" id="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </footer>
        </div>
    </div>
    <script src="script.js?v=4"></script>
</body>
</html>
